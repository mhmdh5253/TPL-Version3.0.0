<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>عدم دسترسی به اینترنت</title>
  <style>
    body{margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center;background:#0f172a;color:#e2e8f0;font-family:Tahoma,Arial,sans-serif}
    .card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:28px;max-width:520px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
    h1{font-size:22px;margin:0 0 12px}
    p{margin:8px 0 0;line-height:1.8}
    .btn{display:inline-block;margin-top:18px;padding:10px 16px;border-radius:8px;background:#2563eb;color:#fff;text-decoration:none}
  </style>
</head>
<body>
  <main class="card">
    <h1>شما آفلاین هستید</h1>
    <p>اتصال اینترنت برقرار نیست یا سرور در دسترس نمی‌باشد. برخی صفحات و فایل‌های ضروری به صورت آفلاین در دسترس‌اند.</p>
    <a class="btn" href="/">بازگشت به صفحه اصلی</a>
  </main>
</body>
</html>
